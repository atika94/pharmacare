{% extends "base.html" %}
{% block title %}Verify Email - PharmaCare{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow"><div class="card-body p-4">
            <h2 class="text-center mb-3">Verify your email</h2>
            <p class="text-muted text-center">Enter the 4-digit code sent to {{ email }}.</p>
            <form method="POST">
                <label for="otp" class="form-label">Verification code</label>
                <input class="form-control text-center" type="text" id="otp" name="otp" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" required autofocus>
                <button type="submit" class="btn btn-primary w-100 mt-3">Verify email</button>
            </form>
            <p class="text-center mt-3 mb-0"><a href="{{ url_for('auth.register') }}">Start again</a></p>
        </div></div>
    </div>
</div>
{% endblock %}
