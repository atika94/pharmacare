{% extends "base.html" %}
{% block title %}Change Password - PharmaCare{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow"><div class="card-body p-4">
            <h2 class="text-center mb-3">Change password</h2>
            <p class="text-muted text-center">Enter your account email to receive a verification code.</p>
            <form method="POST">
                <label for="email" class="form-label">Email</label>
                <input class="form-control" type="email" id="email" name="email" required autofocus>
                <button type="submit" class="btn btn-primary w-100 mt-3">Send verification code</button>
            </form>
        </div></div>
    </div>
</div>
{% endblock %}
