{% extends "base.html" %}

{% block title %}Register - PharmaCare{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6 col-lg-5">

        <div class="card shadow">

            <div class="card-body p-4">

                <h2 class="text-center mb-4">
                    Create Account
                </h2>

                <form method="POST">

                    <div class="mb-3">
                        <label for="name" class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            name="name"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email
                        </label>

                        <input
                            type="text"
                            inputmode="email"
                            class="form-control"
                            id="email"
                            name="email"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            minlength="6"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="confirm_password"
                            name="confirm_password"
                            minlength="6"
                            required
                        >
                    </div>


                    <button type="submit" class="btn btn-primary w-100">
                        Register
                    </button>

                </form>


                <p class="text-center mt-3 mb-0">
                    Already have an account?
                    <a href="{{ url_for('auth.login') }}">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
